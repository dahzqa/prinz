  <body>

        <img src="images/star.png" class="star" style="top: 25%; left: 45%;" alt="">
        <img src="images/star.png" class="star" style="top: 75%; left: 15%;" alt="">
        <img src="images/star.png" class="star" style="top: 65%; left: 85%;" alt="">

    <!-- Ваш основной блок -->
    <div class="pervEcr">
      
      <div class="text-content">
        <h1 class="main-title">

          <span class="flower-letter"></span><span class="flower-letter"></span> 
        </h1>
        <p class="description">
          В мире существует миллион одинаковых вещей, книг, домов, фотографий. Этот лонгрид рассказывает почему вещь становится уникальной не в момент её создания, а когда между ней и человеком появляется связь.
        </p>
